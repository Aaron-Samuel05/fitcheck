name: Replace Emergent Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[auth-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite authentication and AI integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # ---------------- backend ----------------
          p = root / 'backend/server.py'
          s = p.read_text()

          s = s.replace(
              'from fastapi.responses import FileResponse',
              'from fastapi.responses import FileResponse, RedirectResponse'
          )
          s = s.replace(
              'from fastapi.middleware.cors import CORSMiddleware\nfrom emergentintegrations.llm.chat import LlmChat, UserMessage',
              'from fastapi.middleware.cors import CORSMiddleware\nfrom authlib.integrations.starlette_client import OAuth\nfrom starlette.middleware.sessions import SessionMiddleware'
          )

          s = s.replace(
              'REFRESH_TTL_DAYS = int(os.environ.get("REFRESH_TTL_DAYS", "30"))\nFREE_AI_DAILY_LIMIT',
              'REFRESH_TTL_DAYS = int(os.environ.get("REFRESH_TTL_DAYS", "30"))\n# Bump this value to invalidate every previously issued FitCheck access/refresh token.\nAUTH_VERSION = "2026-09-11-auth-v2"\nFREE_AI_DAILY_LIMIT'
          )

          s = re.sub(
              r'\nclass GoogleExchangeRequest\(BaseModel\):\n    session_id: str\n\n',
              '\n',
              s,
              count=1,
          )

          old_app = 'app = FastAPI(title="FitCheck API")\napi_router = APIRouter(prefix="/api")'
          new_app = '''app = FastAPI(title="FitCheck API")

# Authlib uses this signed, short-lived session cookie to protect the OAuth
# authorization transaction/state. It never stores Google credentials in the browser.
auth_session_secret = os.environ.get("AUTH_SESSION_SECRET") or os.environ.get("JWT_SECRET", "fitcheck-development-secret")
app.add_middleware(
    SessionMiddleware,
    secret_key=auth_session_secret,
    same_site="lax",
    https_only=os.environ.get("COOKIE_SECURE", "true").lower() == "true",
)

oauth = OAuth()
oauth.register(
    name="google",
    client_id=os.environ.get("GOOGLE_CLIENT_ID", ""),
    client_secret=os.environ.get("GOOGLE_CLIENT_SECRET", ""),
    server_metadata_url="https://accounts.google.com/.well-known/openid-configuration",
    client_kwargs={
        "scope": "openid email profile",
        "code_challenge_method": "S256",
    },
)

api_router = APIRouter(prefix="/api")'''
          if old_app not in s:
              raise SystemExit('Could not find FastAPI app bootstrap block')
          s = s.replace(old_app, new_app, 1)

          s = s.replace(
              '            "type": "access",\n            "exp":',
              '            "type": "access",\n            "ver": AUTH_VERSION,\n            "exp":',
              1,
          )
          s = s.replace(
              '            "type": "refresh",\n            "exp":',
              '            "type": "refresh",\n            "ver": AUTH_VERSION,\n            "exp":',
              1,
          )
          s = s.replace(
              '        if payload.get("type") != "access":\n            raise HTTPException(401, "Invalid token type")',
              '        if payload.get("type") != "access" or payload.get("ver") != AUTH_VERSION:\n            raise HTTPException(401, "Session expired. Please sign in again.")',
              1,
          )
          s = s.replace(
              '        if payload.get("type") != "refresh":\n            raise HTTPException(401, "Invalid token type")',
              '        if payload.get("type") != "refresh" or payload.get("ver") != AUTH_VERSION:\n            raise HTTPException(401, "Session expired. Please sign in again.")',
              1,
          )

          old_google = re.search(r'\n@api_router\.post\("/auth/google/exchange"\).*?\n\n# ---------------- AI Buddy ----------------', s, re.S)
          if not old_google:
              raise SystemExit('Could not find old Emergent Google auth block')

          new_google = '''
@api_router.get("/auth/google", name="google_login")
async def google_login(request: Request):
    if not os.environ.get("GOOGLE_CLIENT_ID") or not os.environ.get("GOOGLE_CLIENT_SECRET"):
        raise HTTPException(503, "Google authentication is not configured on this deployment.")
    redirect_uri = os.environ.get("GOOGLE_REDIRECT_URI", "").strip() or str(request.url_for("google_callback"))
    return await oauth.google.authorize_redirect(request, redirect_uri)


@api_router.get("/auth/google/callback", name="google_callback")
async def google_callback(request: Request):
    frontend_url = os.environ.get("FRONTEND_URL", "").strip().rstrip("/")
    if not frontend_url:
        raise HTTPException(503, "FRONTEND_URL is not configured.")

    try:
        token = await oauth.google.authorize_access_token(request)
        google_user = token.get("userinfo") or await oauth.google.userinfo(token=token)
        google_sub = str(google_user.get("sub", "")).strip()
        email = str(google_user.get("email", "")).strip().lower()
        email_verified = google_user.get("email_verified")
        name = str(google_user.get("name", "")).strip()

        if not google_sub or not email or email_verified is False:
            raise ValueError("Google did not return a verified account")

        user = await db.users.find_one({"$or": [{"google_sub": google_sub}, {"email": email}]})
        if not user:
            user = {
                "id": str(uuid.uuid4()),
                "email": email,
                "created_at": datetime.now(timezone.utc).isoformat(),
                "auth_provider": "google",
                "google_sub": google_sub,
                "name": name,
                "age": None,
                "height_cm": None,
                "weight_kg": None,
                "goal": "",
                "plan": "free",
                "subscription_status": None,
                "current_period_end": None,
            }
            await db.users.insert_one(user)
        else:
            updates = {"google_sub": google_sub, "auth_provider": "google"}
            if not user.get("name") and name:
                updates["name"] = name
            await db.users.update_one({"id": user["id"]}, {"$set": updates})
            user = await db.users.find_one({"id": user["id"]})

        access_token = create_access(user["id"], user["email"])
        refresh_token = create_refresh(user["id"])
        response = RedirectResponse(url=f"{frontend_url}/app?google=success", status_code=302)
        set_auth_cookies(response, access_token, refresh_token)
        request.session.pop("_state_google", None)
        return response
    except HTTPException:
        raise
    except Exception:
        logging.exception("Google OAuth callback failed")
        return RedirectResponse(url=f"{frontend_url}/?google=error", status_code=302)


# ---------------- AI Buddy ----------------'''
          s = s[:old_google.start()] + '\n' + new_google + s[old_google.end():]

          # Replace the Emergent AI implementation with direct Gemini REST.
          old_ai = re.search(r'async def generate_ai_reply\(session_id: str, user_message: str, user_id: str\) -> str:.*?\n\n@api_router\.get\("/ai/status"\)', s, re.S)
          if not old_ai:
              raise SystemExit('Could not find Emergent AI implementation')

          new_ai = '''async def generate_ai_reply(session_id: str, user_message: str, user_id: str) -> str:
    api_key = os.environ.get("GEMINI_API_KEY", "").strip()
    if not api_key:
        raise HTTPException(503, "AI Buddy is not configured. Add GEMINI_API_KEY to the backend environment and redeploy.")

    user = await db.users.find_one({"id": user_id})
    profile = profile_from_user(user or {})
    profile_text = ", ".join(f"{k}: {v}" for k, v in profile.items() if v not in (None, "")) or "No profile details provided"
    previous = await db.chat_messages.find({"user_id": user_id, "session_id": session_id}).sort("created_at", -1).to_list(12)
    previous.reverse()
    context = "\\n".join(f"{m.get('role', 'user').upper()}: {m.get('message', '')}" for m in previous)
    prompt = f"User profile: {profile_text}\\n\\nConversation so far:\\n{context}\\n\\nUSER: {user_message}\\n\\nReply as FitCheck Coach."

    model_name = os.environ.get("FITCHECK_AI_MODEL", "gemini-3.6-flash")
    url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent"
    payload = {
        "system_instruction": {"parts": [{"text": AI_SYSTEM_PROMPT}]},
        "contents": [{"role": "user", "parts": [{"text": prompt}]}],
    }

    try:
        async with httpx.AsyncClient(timeout=45) as client:
            response = await client.post(url, headers={"x-goog-api-key": api_key, "Content-Type": "application/json"}, json=payload)
        if response.status_code >= 400:
            logging.error("Gemini API error %s: %s", response.status_code, response.text[:500])
            raise HTTPException(502, "AI Buddy is temporarily unavailable. Please try again.")
        data = response.json()
        reply = str(data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "")).strip()
        if not reply:
            raise HTTPException(502, "AI Buddy returned an empty response. Please try again.")
        return reply
    except HTTPException:
        raise
    except Exception:
        logging.exception("Gemini AI provider error")
        raise HTTPException(502, "AI Buddy is temporarily unavailable. Please try again.")


@api_router.get("/ai/status")'''
          s = s[:old_ai.start()] + new_ai + s[old_ai.end():]
          s = s.replace('key_configured = bool(os.environ.get("EMERGENT_LLM_KEY", "").strip())', 'key_configured = bool(os.environ.get("GEMINI_API_KEY", "").strip())', 1)

          # Cookie settings: Google OAuth callback is cross-origin from Vercel in the common deployment.
          old_cookie = '''def set_auth_cookies(response: Response, access_token: str, refresh_token: str):
    response.set_cookie("access_token", access_token, httponly=True, samesite="lax", secure=True, path="/")
    response.set_cookie("refresh_token", refresh_token, httponly=True, samesite="lax", secure=True, path="/api/auth")'''
          new_cookie = '''def set_auth_cookies(response: Response, access_token: str, refresh_token: str):
    secure = os.environ.get("COOKIE_SECURE", "true").lower() == "true"
    samesite = "none" if secure else "lax"
    response.set_cookie("access_token", access_token, httponly=True, samesite=samesite, secure=secure, path="/")
    response.set_cookie("refresh_token", refresh_token, httponly=True, samesite=samesite, secure=secure, path="/api/auth")'''
          if old_cookie not in s:
              raise SystemExit('Could not find cookie helper')
          s = s.replace(old_cookie, new_cookie, 1)

          s = s.replace(
              '        response.set_cookie("access_token", access_token, httponly=True, samesite="lax", secure=True, path="/")',
              '        secure = os.environ.get("COOKIE_SECURE", "true").lower() == "true"\n        samesite = "none" if secure else "lax"\n        response.set_cookie("access_token", access_token, httponly=True, samesite=samesite, secure=secure, path="/")',
              1,
          )

          p.write_text(s)

          # ---------------- frontend auth modal ----------------
          p = root / 'frontend/src/components/AuthModal.jsx'
          s = p.read_text()
          s = s.replace('import { toast } from "sonner";', 'import { toast } from "sonner";\nimport { API } from "@/lib/api";')
          s = re.sub(
              r'function startGoogleAuth\(\) \{.*?\n\}',
              'function startGoogleAuth() {\n  window.location.assign(`${API}/auth/google`);\n}',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)

          # ---------------- frontend Google callback ----------------
          p = root / 'frontend/src/components/GoogleCallbackHandler.jsx'
          p.write_text('''import { useEffect, useRef } from "react";
import { useNavigate, useLocation } from "react-router-dom";
import { useAuth } from "@/context/AuthContext";
import { toast } from "sonner";

export default function GoogleCallbackHandler() {
  const { refresh } = useAuth();
  const navigate = useNavigate();
  const location = useLocation();
  const processed = useRef(false);

  useEffect(() => {
    if (processed.current) return;
    const params = new URLSearchParams(location.search);
    const status = params.get("google");
    if (!status) return;
    processed.current = true;

    if (status === "error") {
      toast.error("Google sign-in failed. Please try again.");
      navigate("/", { replace: true });
      return;
    }

    (async () => {
      try {
        const me = await refresh?.();
        if (!me) throw new Error("Google sign-in succeeded but the FitCheck session could not be loaded.");
        toast.success("Signed in with Google.");
        navigate("/app", { replace: true });
      } catch (e) {
        toast.error(e.message || "Google sign-in failed.");
        navigate("/", { replace: true });
      }
    })();
  }, [location.search, refresh, navigate]);

  return null;
}
''')

          # ---------------- frontend auth context ----------------
          p = root / 'frontend/src/context/AuthContext.jsx'
          s = p.read_text()
          old = '''    const hasSessionId = new URLSearchParams(window.location.hash.replace(/^#/, "")).has("session_id");
    const token = localStorage.getItem("token");

    if (hasSessionId) return;

    if (!token || token === "undefined" || token === "null") {
      localStorage.removeItem("token");
      setUser(false);
      return;
    }

    fetchMe();'''
          new = '''    const params = new URLSearchParams(window.location.search);
    const googleCallback = params.get("google") === "success";
    const token = localStorage.getItem("token");

    // Google OAuth authenticates through an HttpOnly backend cookie, so a localStorage
    // token is intentionally not required during the callback or on subsequent reloads.
    if (!token || token === "undefined" || token === "null") {
      if (googleCallback) {
        fetchMe();
        return;
      }
      fetchMe().then((result) => {
        if (!result) setUser(false);
      });
      return;
    }

    fetchMe();'''
          if old not in s:
              raise SystemExit('Could not find old AuthContext bootstrap')
          p.write_text(s.replace(old, new, 1))

          # ---------------- environment examples ----------------
          p = root / 'backend/.env.example'
          s = p.read_text()
          s = s.replace('EMERGENT_LLM_KEY=\nFITCHECK_AI_MODEL=gemini-3-flash-preview', 'GEMINI_API_KEY=\nFITCHECK_AI_MODEL=gemini-3.6-flash')
          s += '''\n# Google OAuth (create a Web application OAuth client in Google Cloud)\nGOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=\nGOOGLE_REDIRECT_URI=https://YOUR-BACKEND-DOMAIN/api/auth/google/callback\nAUTH_SESSION_SECRET=\nCOOKIE_SECURE=true\nFRONTEND_URL=https://fitcheck-org.vercel.app\n'''
          p.write_text(s)

          # ---------------- requirements ----------------
          p = root / 'backend/requirements.txt'
          lines = [line for line in p.read_text().splitlines() if not line.startswith('emergentintegrations==')]
          if not any(line.lower().startswith('authlib') for line in lines):
              lines.append('authlib>=1.7.0')
          if not any(line.lower().startswith('itsdangerous') for line in lines):
              lines.append('itsdangerous>=2.2.0')
          p.write_text('\n'.join(lines) + '\n')

          # Remove any remaining Emergent auth/AI references from the repository's backend/frontend source.
          for path in [root / 'backend/server.py', root / 'backend/.env.example', root / 'frontend/src/components/AuthModal.jsx', root / 'frontend/src/components/GoogleCallbackHandler.jsx']:
              text = path.read_text()
              if 'auth.emergentagent.com' in text or 'EMERGENT_LLM_KEY' in text or 'emergentintegrations' in text:
                  raise SystemExit(f'Remaining Emergent reference in {path}')
          PY

      - name: Commit migration
        run: |
          git config user.name "fitcheck-auth-migration"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend .github/workflows/remove-emergent-auth.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "replace Emergent auth with open source Google OAuth [auth-migration]"
          git push
